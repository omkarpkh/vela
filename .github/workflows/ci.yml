name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contrast
      - run: npm run build
      # Packs the real tarball, installs it into a scratch app, and proves the
      # published types reject the documented rule violations.
      - run: node scripts/verify-pack.mjs

  # Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret exists.
  # npm attaches a provenance attestation automatically on this path.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm publish --access public
