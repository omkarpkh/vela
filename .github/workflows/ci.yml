name: CI

on:
  push:
    branches: [main]
    # Tags must be listed explicitly. Without this the publish job below is
    # unreachable — a tag push matches no trigger, so the workflow never starts.
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The generated targets (CSS, Dart, MUI theme) must match the token source. A hand edit fails here.
      - run: npm run tokens:check
      # DTCG 2025.10 conformance (Format, Color, Resolver modules) via @terrazzo/parser; a warning fails.
      - run: npm run tokens:validate
      # Every documented rule carries a proof, or this fails. See scripts/check-rules.mjs.
      - run: npm run rules:check
      - run: npm test
      # demo/checks.json is written from the runners' output and committed; a stale count fails here.
      - run: npm run checks:check
      - run: npm run contrast
      - run: npm run build
      # Packs the real tarball, installs it into a scratch app, and proves the
      # published types reject the documented rule violations.
      - run: node scripts/verify-pack.mjs

  # The package ships a Dart file generated from the token source. `verify` parses it
  # when a Dart SDK is present; this job compiles it against a real Flutter SDK and
  # runs the package's own tests, so "generated" also means "analyzes clean and
  # installs as a theme". Publish waits for it.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Browser tests: visual regression (every component section and both "adopt without rewrite"
  # columns, light and dark, against the committed Linux baselines) plus the playground's
  # behavioural checks in tests/e2e.
  # On a failure the diff report is uploaded so the change can be judged, not guessed.
  visual:
    runs-on: ubuntu-latest
    # On a pull request the job may commit missing Linux baselines to the PR branch (below).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head, not the synthetic merge commit, so new baselines can be pushed back.
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A new section or a new width has no baseline yet. Only the runner may write a -linux
      # baseline (a laptop writes -darwin; a fontless container writes the wrong face), so on a
      # pull request the runner writes the MISSING ones, commits them to the branch for review
      # in the PR diff, and then gates against them below. Existing baselines are never rewritten
      # here: that is a deliberate act via the "Visual baselines" workflow with mode=all.
      - name: Write missing Linux baselines (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          CI= npx playwright test tests/visual --update-snapshots missing --reporter=line || true
          echo "Baselines written:"; git status --short tests/visual | sed 's/^/  /'
          git add tests/visual/*-snapshots/*-linux.png
          if git diff --cached --quiet; then echo "No missing baseline."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "Visual baselines (missing): ${n} Linux screenshots written by the CI runner" \
                     -m "Written by the visual job of run ${{ github.run_id }} for review in this PR."
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            tests/visual/*-snapshots/
          if-no-files-found: ignore
          retention-days: 14

  # The demo site — overview, foundations, the playground — deploys to GitHub Pages from
  # main, only after verify, flutter and visual have passed: https://omkarpkh.github.io/vela/
  pages:
    if: github.ref == 'refs/heads/main'
    needs: [verify, flutter, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run demo:build
        env:
          VITE_BASE: /vela/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - id: deploy
        uses: actions/deploy-pages@v4

  # Publishing uses npm Trusted Publishing (OIDC). No NPM_TOKEN secret exists,
  # and none should be created: as of Aug 2026 granular access tokens cannot
  # publish at all. npm attaches a provenance attestation automatically on this
  # path, tying the tarball to this commit and this workflow file.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, flutter, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # lets GitHub mint the OIDC token npm exchanges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.x, so the
      # upgrade is required — without it the publish falls back to looking for a
      # token and fails with ENEEDAUTH. Pinned to the 11 line rather than @latest
      # so a future major cannot change this job's behaviour without a commit.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - run: npm ci
      - run: npm run build

      # Tagging a historical commit, or re-running a release, should be a no-op
      # rather than a red X. npm has no --if-not-exists, so check first.
      - name: Is this version already on the registry?
        id: published
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@omkarux/vela@$V" version >/dev/null 2>&1; then
            echo "Already published: $V — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts skips prepublishOnly on purpose. The full gate already
      # ran in the `verify` job this one depends on; running it again here
      # repeats minutes of work and puts a second failure surface inside the
      # publish step itself — which is exactly what broke the first tagged release.
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --access public --ignore-scripts
