name: Bug
description: A component, token, bridge or script does something the spec does not say.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Read the component's spec in `guidelines/components/` first. If a value is not in the Props table, it does not exist, and the type error you are seeing is the rule working. A security problem goes to the address in `SECURITY.md`, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npm ls @omkarux/vela`, or the commit for the docs site or a script."
      placeholder: "0.12.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Component (React)
        - Tokens (CSS, JSON)
        - Flutter target (tokens.dart)
        - MUI theme bridge (mui-theme.json)
        - Figma library or a scripts/figma script
        - Docs site or playground
        - Build, verify or CI
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or token
      description: The name as the spec or `tokens/vela.tokens.json` spells it.
      placeholder: "Button, --vela-btn-primary-hover-bg"
  - type: textarea
    id: expected
    attributes:
      label: What the spec says should happen
      description: Quote the line from `guidelines/`. If the spec says nothing, say so; that may be the bug.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Numbers where there are any (a contrast ratio, a pixel offset, a count).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: JSX or a link. Say which theme (light, dark, OS) and which browser and version.
      render: tsx
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I read the spec for this component or token.
          required: true
