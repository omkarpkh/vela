<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vela Design System</title>
    <!-- Vela's favicon: a copy of brand/vela-favicon-16.svg (a unit test holds the two identical). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- What shows before the scripts run, and without them (playground spec, section 7). React
         replaces the contents of #root on its first render. -->
    <div id="root"><p class="boot">Loading Vela's playground…</p></div>
    <noscript>
      <p class="boot">Vela's playground needs JavaScript. The specs are readable on GitHub.
        <a href="https://github.com/omkarpkh/vela/tree/main/guidelines">Read the guidelines on GitHub</a></p>
    </noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
