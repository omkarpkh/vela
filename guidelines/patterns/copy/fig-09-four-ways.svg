<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" width="760" height="216" role="img" aria-label="The same copy for pointer, keyboard, screen reader and reduced motion: what each gets before, at the press, when copied, and after."><style>
.bg{fill:#fff}.panel{fill:#eef2f2}.ln{stroke:#dde3e4;fill:none}.box{fill:#fff;stroke:#dde3e4}
.t{font:400 13px -apple-system,"Segoe UI",Roboto,sans-serif;fill:#49555a}.h{font-weight:600;fill:#191d1f}
.m{font:400 12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#191d1f}.mu{fill:#667377}.s{font-size:11.5px}
.cap{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.06em;fill:#667377}
.g{fill:none;stroke:#49555a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{stroke:#b3261e}.ok{fill:#175c33}.bad{fill:#ab3125}.okl{stroke:#175c33}.badl{stroke:#ab3125}
.sel{fill:#cfe6ea}.key{fill:#eef2f2;stroke:#7f8c90}.acc{fill:#0a6c7d}.accl{stroke:#0a6c7d;fill:none}
.dash{stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){.bg{fill:#11171a}.panel{fill:#1b2225}.ln{stroke:#262e31}.box{fill:#161d20;stroke:#262e31}
.t{fill:#c8d0d2}.h{fill:#f7f9f9}.m{fill:#f7f9f9}.mu{fill:#7f8c90}.cap{fill:#7f8c90}.g{stroke:#c8d0d2}.err{stroke:#f0918c}
.ok{fill:#86c795}.bad{fill:#f0918c}.okl{stroke:#86c795}.badl{stroke:#f0918c}.sel{fill:#1f4750}.key{fill:#1b2225;stroke:#667377}.acc{fill:#2f9db3}.accl{stroke:#2f9db3}}
</style><rect class="bg" width="760" height="216" rx="8"/><text x="20" y="24" class="cap" text-anchor="start"></text><text x="150" y="24" class="cap" text-anchor="start">Before</text><text x="302" y="24" class="cap" text-anchor="start">Press</text><text x="454" y="24" class="cap" text-anchor="start">Copied</text><text x="606" y="24" class="cap" text-anchor="start">After</text><rect x="14" y="36" width="732" height="36" rx="5" class="panel"/><text x="24" y="59" class="t s h" text-anchor="start">Pointer</text><text x="150" y="59" class="t s" text-anchor="start">hover: leans</text><text x="302" y="59" class="t s" text-anchor="start">press: 88%</text><text x="454" y="59" class="t s" text-anchor="start">the morph, 240 ms</text><text x="606" y="59" class="t s" text-anchor="start">hands back on return</text><rect x="14" y="80" width="732" height="36" rx="5" class="panel"/><text x="24" y="103" class="t s h" text-anchor="start">Keyboard</text><text x="150" y="103" class="t s" text-anchor="start">focus: tooltip</text><text x="302" y="103" class="t s" text-anchor="start">Enter or Space</text><text x="454" y="103" class="t s" text-anchor="start">the tick, next frame</text><text x="606" y="103" class="t s" text-anchor="start">hands back instantly</text><rect x="14" y="124" width="732" height="36" rx="5" class="panel"/><text x="24" y="147" class="t s h" text-anchor="start">Screen reader</text><text x="150" y="147" class="t s" text-anchor="start">“Copy request id, button”</text><text x="302" y="147" class="t s" text-anchor="start">—</text><text x="454" y="147" class="t s" text-anchor="start">“Copied request id”, once</text><text x="606" y="147" class="t s" text-anchor="start">focus never moves</text><rect x="14" y="168" width="732" height="36" rx="5" class="panel"/><text x="24" y="191" class="t s h" text-anchor="start">Reduced motion</text><text x="150" y="191" class="t s" text-anchor="start">no lean</text><text x="302" y="191" class="t s" text-anchor="start">press: 88%</text><text x="454" y="191" class="t s" text-anchor="start">the tick in one frame</text><text x="606" y="191" class="t s" text-anchor="start">the hold is unchanged</text></svg>