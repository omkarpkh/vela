<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Five do and don&#x27;t pairs: always visible, not on hover; Not set instead of a disabled button; copy the full value, not the display; a secret is fetched, not in the page; many rows are an export, not a copy."><style>
.bg{fill:#fff}.panel{fill:#eef2f2}.ln{stroke:#dde3e4;fill:none}.box{fill:#fff;stroke:#dde3e4}
