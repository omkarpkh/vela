" y="302" width="330" height="74" rx="6" class="panel"/><circle cx="40" cy="322" r="8" class="ok"/><path d="M4.5 8.5l2.5 2.5 4.5-5" transform="translate(32 314)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="327" class="t s" text-anchor="start">A secret is dots until copied or shown</text><text x="34" y="356" class="m" text-anchor="start">•••••••• a9F2</text><rect x="154" y="340" width="24" height="24" rx="3" class="bg"/><g transform="translate(158 344) scale(0.6666666666666666)" class="g" ><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><rect x="370" y="302" width="330" height="74" rx="6" class="panel"/><circle cx="390" cy="322" r="8" class="bad"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" transform="translate(382 314)" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="406" y="327" class="t s" text-anchor="start">The secret sits in the page, masked by CSS</text><text x="384" y="356" class="m" text-anchor="start">vela_sample_… (in the DOM)</text><rect x="584" y="340" width="24" height="24" rx="3" class="bg"/><g transform="translate(588 344) scale(0.6666666666666666)" class="g" ><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><rect x="20" y="388" width="330" height="74" rx="6" class="panel"/><circle cx="40" cy="408" r="8" class="ok"/><path d="M4.5 8.5l2.5 2.5 4.5-5" transform="translate(32 400)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="413" class="t s" text-anchor="start">Many rows → Export</text><rect x="34" y="426" width="92" height="26" rx="4" class="box"/><text x="80" y="443" class="t" text-anchor="middle">Export CSV</text><rect x="370" y="388" width="330" height="74" rx="6" class="panel"/><circle cx="390" cy="408" r="8" class="bad"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" transform="translat