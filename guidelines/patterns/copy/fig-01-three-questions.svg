<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="A table of hosts. The first IP shows a tick: it was just copied. The second carries the word Copied: the last one taken. The third shows the copy mark: ready to copy again."><style>
.bg{fill:#fff}.panel{fill:#eef2f2}.ln{stroke:#dde3e4;fill:none}.box{fill:#fff;stroke:#dde3e4}
.t{font:400 13px -apple-system,"Segoe UI",Roboto,sans-serif;fill:#49555a}.h{font-weight:600;fill:#191d1f}
.m{font:400 12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#191d1f}.mu{fill:#667377}.s{font-size:11.5px}
.cap{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.06em;fill:#667377}
.g{fill:none;stroke:#49555a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{stroke:#b3261e}.ok{fill:#175c33}.bad{fill:#ab3125}.okl{stroke:#175c33}.badl{stroke:#ab3125}
.sel{fill:#cfe6ea}.key{fill:#eef2f2;stroke:#7f8c90}.acc{fill:#0a6c7d}.accl{stroke:#0a6c7d;fill:none}
.dash{stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){.bg{fill:#11171a}.panel{fill:#1b2225}.ln{stroke:#262e31}.box{fill:#161d20;stroke:#262e31}
.t{fill:#c8d0d2}.h{fill:#f7f9f9}.m{fill:#f7f9f9}.mu{fill:#7f8c90}.cap{fill:#7f8c90}.g{stroke:#c8d0d2}.err{stroke:#f0918c}
.ok{fill:#86c795}.bad{fill:#f0918c}.okl{stroke:#86c795}.badl{stroke:#f0918c}.sel{fill:#1f4750}.key{fill:#1b2225;stroke:#667377}.acc{fill:#2f9db3}.accl{stroke:#2f9db3}}
</style><rect class="bg" width="720" height="250" rx="8"/><text x="20" y="30" class="t h" text-anchor="start">Hosts</text><line x1="20" y1="50" x2="700" y2="50" class="ln"/><text x="20" y="84" class="t" text-anchor="start">db-primary</text><text x="130" y="84" class="m" text-anchor="start">10.42.7.19</text><rect x="222" y="67" width="24" height="24" rx="3" class="bg"/><g transform="translate(226 71) scale(0.6666666666666666)" class="g" ><path d="M20 6 9 17l-5-5"/></g><line x1="20" y1="110" x2="300" y2="110" class="ln"/><line x1="252" y1="79" x2="330" y2="79" class="accl dash"/><text x="340" y="76" class="t h" text-anchor="start">Did it work?</text><text x="340" y="94" class="t s mu" text-anchor="start">The tick, only once the write is done.</text><text x="20" y="144" class="t" text-anchor="start">cache-02</text><text x="130" y="144" class="m" text-anchor="start">10.42.7.44</text><rect x="222" y="127" width="24" height="24" rx="3" class="bg"/><g transform="translate(226 131) scale(0.6666666666666666)" class="g" ><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><text x="254" y="144" class="t s" text-anchor="start">Copied</text><line x1="20" y1="170" x2="300" y2="170" class="ln"/><line x1="304" y1="139" x2="330" y2="139" class="accl dash"/><text x="340" y="136" class="t h" text-anchor="start">Which one did I take?</text><text x="340" y="154" class="t s mu" text-anchor="start">One word, on the last one, after the tick hands back.</text><text x="20" y="204" class="t" text-anchor="start">edge-11</text><text x="130" y="204" class="m" text-anchor="start">10.42.8.3</text><rect x="222" y="187" width="24" height="24" rx="3" class="bg"/><g transform="translate(226 191) scale(0.6666666666666666)" class="g" ><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><line x1="20" y1="230" x2="300" y2="230" class="ln"/><line x1="252" y1="199" x2="330" y2="199" class="accl dash"/><text x="340" y="196" class="t h" text-anchor="start">Can I take it again?</text><text x="340" y="214" class="t s mu" text-anchor="start">Always: the button never disables itself.</text></svg>