<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Before: an agent-written command with curly quotes and an invisible character. After: Vela shows the hidden character as an escape, warns about both, and says the trailing newline was removed."><style>
.bg{fill:#fff}.panel{fill:#eef2f2}.ln{stroke:#dde3e4;fill:none}.box{fill:#fff;stroke:#dde3e4}
.t{font:400 13px -apple-system,"Segoe UI",Roboto,sans-serif;fill:#49555a}.h{font-weight:600;fill:#191d1f}
.m{font:400 12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#191d1f}.mu{fill:#667377}.s{font-size:11.5px}
.cap{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.06em;fill:#667377}
.g{fill:none;stroke:#49555a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{stroke:#b3261e}.ok{fill:#175c33}.bad{fill:#ab3125}.okl{stroke:#175c33}.badl{stroke:#ab3125}
.sel{fill:#cfe6ea}.key{fill:#eef2f2;stroke:#7f8c90}.acc{fill:#0a6c7d}.accl{stroke:#0a6c7d;fill:none}
.dash{stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){.bg{fill:#11171a}.panel{fill:#1b2225}.ln{stroke:#262e31}.box{fill:#161d20;stroke:#262e31}
.t{fill:#c8d0d2}.h{fill:#f7f9f9}.m{fill:#f7f9f9}.mu{fill:#7f8c90}.cap{fill:#7f8c90}.g{stroke:#c8d0d2}.err{stroke:#f0918c}
.ok{fill:#86c795}.bad{fill:#f0918c}.okl{stroke:#86c795}.badl{stroke:#f0918c}.sel{fill:#1f4750}.key{fill:#1b2225;stroke:#667377}.acc{fill:#2f9db3}.accl{stroke:#2f9db3}}
</style><rect class="bg" width="760" height="210" rx="8"/><text x="20" y="30" class="t h" text-anchor="start">What the agent wrote</text><text x="390" y="30" class="t h" text-anchor="start">What Vela shows</text><rect x="18" y="44" width="350" height="70" rx="6" class="panel"/><text x="30" y="72" class="m" text-anchor="start">curl -H “Auth: $T” https://api…</text><text x="30" y="96" class="t s mu" text-anchor="start">(a right-to-left mark sits after api, unseen)</text><rect x="388" y="44" width="354" height="70" rx="6" class="panel"/><text x="400" y="72" class="m" text-anchor="start">curl -H “Auth: $T” https://api\u200F…</text><rect x="712" y="58" width="24" height="24" rx="3" class="bg"/><g transform="translate(716 62) scale(0.6666666666666666)" class="g" ><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g><g transform="translate(388 128) scale(0.5)" class="g" ><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></g><text x="406" y="139" class="t s" text-anchor="start">Contains hidden characters</text><g transform="translate(388 150) scale(0.5)" class="g" ><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></g><text x="406" y="161" class="t s" text-anchor="start">Contains curly quotes, which shells don’t accept</text><text x="388" y="190" class="t s h" text-anchor="start">After copying: “Copied command · trailing newline removed”</text><text x="20" y="140" class="t s mu" text-anchor="start">Pasted into a terminal, this runs differently</text><text x="20" y="156" class="t s mu" text-anchor="start">from how it reads.</text><text x="20" y="190" class="t s mu" text-anchor="start">Vela flags it and copies it exactly. It never fixes a command.</text></svg>