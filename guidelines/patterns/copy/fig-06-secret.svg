<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="A secret: dots at rest; copied with a receipt that gives the length; blocked, with a Show key to copy button; shown in a selected field with a hint to press Command C."><style>
